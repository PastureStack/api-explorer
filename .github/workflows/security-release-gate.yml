name: Security release gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-explorer-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Python verifier
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.9'
          check-latest: false

      - name: Verify Python packaging and CA tools
        run: |
          set -euo pipefail
          bash scripts/setup-ci-python-tools

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Use the locked npm release
        shell: bash
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund

      - name: Verify source identity and lock files
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor 80270e0af984025b14afc61c0d0b0a4f08d968bf HEAD
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-revision.txt
          sha256sum package.json package-lock.json .github/workflows/*.yml > evidence/source-locks.sha256
          node --version | tee evidence/node-version.txt
          npm --version | tee evidence/npm-version.txt
          test "$(node --version)" = 'v24.22.1'
          test "$(npm --version)" = '12.0.2'

      - name: Retain actual Node SDK and host Brotli inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          versions = json.loads(subprocess.check_output(
              ["node", "-p", "JSON.stringify(process.versions)"], text=True))
          assert versions["node"] == "24.22.1"
          node = subprocess.check_output(["which", "node"], text=True).strip()
          linkage = subprocess.check_output(["ldd", node], text=True)
          assert "libbrotli" not in linkage, "Node unexpectedly uses host Brotli"
          packages = []
          inventory = subprocess.check_output(
              ["dpkg-query", "-W", "-f=${Status}\t${binary:Package}\t${Version}\n"], text=True)
          for line in inventory.splitlines():
              status, name, version = line.split("\t")
              if status.split()[-1] == "installed" and "brotli" in name:
                  packages.append({"name": name, "version": version})
          subprocess.run(["node", "-e", """
          const z = require('node:zlib');
          for (const input of [Buffer.alloc(0), Buffer.from('ordinary SDK control\\n'.repeat(32)), Buffer.from(Array.from({length:256}, (_,i)=>i))]) {
            if (!z.brotliDecompressSync(z.brotliCompressSync(input)).equals(input)) process.exit(1);
          }
          """], check=True)
          proof = {
              "schemaVersion": 1, "sourceCommit": os.environ["GITHUB_SHA"],
              "scope": "Ubuntu CI host and official Node SDK; not shipped browser runtime",
              "nodeVersions": versions, "nodeDynamicLibraries": linkage.splitlines(),
              "hostBrotliPackages": packages, "runnerImageVersion": os.environ.get("ImageVersion"),
              "normalNodeBrotliRoundTrips": 3, "securityTriggerExecuted": False,
              "hostPackagePresenceIsPatchOrReachabilityProof": False,
          }
          Path("evidence/builder-sdk-inventory.json").write_text(
              json.dumps(proof, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print("API_EXPLORER_NODE_SDK_OK " + json.dumps(proof, sort_keys=True))
          PY

      - name: Install, test, audit, and build twice
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --omit=optional --no-audit --no-fund
          npm ls jsdom undici --all --json > evidence/jsdom-sdk-dependency-graph.json
          cp package-lock.json evidence/package-lock.json
          npm audit --omit=dev --json > evidence/npm-audit-runtime.json
          npm audit --json > evidence/npm-audit-all.json
          npm run ci | tee evidence/ci-validation.log
          version=$(node -p "require('./package.json').version")
          artifact="dist/${version}.tar.gz"
          # scripts/ci already compares two complete builds byte for byte.
          # Retain that exact tested archive before runner cleanup.
          cp "$artifact" "evidence/api-explorer-${version}.tar.gz"
          cp THIRD-PARTY-NOTICES.md evidence/
          sha256sum "$artifact" > evidence/product-artifact.sha256
          tar -tzf "$artifact" > evidence/product-members.txt
          (cd evidence && sha256sum "api-explorer-${version}.tar.gz" > SHA256SUMS)

      - name: Generate package SBOM
        shell: bash
        run: |
          set -euo pipefail
          npm exec --yes --package='@cyclonedx/cyclonedx-npm@6.0.1' -- cyclonedx-npm \
            --output-format JSON \
            --spec-version 1.6 \
            --output-file evidence/api-explorer.cdx.json
          (cd evidence && sha256sum api-explorer.cdx.json >> SHA256SUMS)

      - name: Scan immutable source and product
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$TRIVY_IMAGE"
          cache="$RUNNER_TEMP/trivy-cache"
          source_tree="$(mktemp -d)"
          product_tree="$(mktemp -d)"
          trap 'rm -rf "$source_tree" "$product_tree"' EXIT
          mkdir -p "$cache" "$product_tree"
          git archive --format=tar HEAD | tar -xf - -C "$source_tree"
          version=$(node -p "require('./package.json').version")
          tar -xzf "dist/${version}.tar.gz" -C "$product_tree"
          docker run --rm -v "$cache:/root/.cache/trivy" "$TRIVY_IMAGE" image --download-db-only
          docker run --rm -v "$source_tree:/scan:ro" -v "$PWD/evidence:/evidence" -v "$cache:/root/.cache/trivy" "$TRIVY_IMAGE" fs \
            --skip-db-update --offline-scan --scanners vuln,secret --format json --output /evidence/source-security.json /scan
          docker run --rm -v "$product_tree:/scan:ro" -v "$PWD/evidence:/evidence" -v "$cache:/root/.cache/trivy" "$TRIVY_IMAGE" rootfs \
            --skip-db-update --offline-scan --scanners vuln,secret --format json --output /evidence/product-security.json /scan

      - name: Enforce candidate security
        shell: bash
        run: |
          set -euo pipefail
          : > evidence/security-summary.txt
          for scope in source product; do
            report="evidence/${scope}-security.json"
            secrets=$(jq '[.Results[]?.Secrets[]?] | length' "$report")
            critical=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' "$report")
            high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' "$report")
            printf '%s_secrets=%s\n%s_critical=%s\n%s_high=%s\n' "$scope" "$secrets" "$scope" "$critical" "$scope" "$high" | tee -a evidence/security-summary.txt
            test "$secrets" -eq 0
            test "$critical" -eq 0
            test "$high" -eq 0
          done
          jq -e '.metadata.vulnerabilities.critical == 0 and .metadata.vulnerabilities.high == 0' evidence/npm-audit-runtime.json >/dev/null
          jq -e '.metadata.vulnerabilities.critical == 0 and .metadata.vulnerabilities.high == 0' evidence/npm-audit-all.json >/dev/null
          jq -e '.bomFormat == "CycloneDX" and .specVersion == "1.6" and (.components | length) > 0' evidence/api-explorer.cdx.json >/dev/null
          (cd evidence && sha256sum source-security.json product-security.json \
            npm-audit-runtime.json npm-audit-all.json security-summary.txt \
            THIRD-PARTY-NOTICES.md source-revision.txt source-locks.sha256 \
            node-version.txt npm-version.txt product-artifact.sha256 product-members.txt \
            ci-validation.log builder-sdk-inventory.json jsdom-sdk-dependency-graph.json \
            package-lock.json >> SHA256SUMS)

      - name: Upload reviewed evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-explorer-security-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Clean runner resources
        if: always()
        shell: bash
        run: |
          set +e
          docker image rm -f "$TRIVY_IMAGE" 2>/dev/null
          rm -rf node_modules dist tmp
